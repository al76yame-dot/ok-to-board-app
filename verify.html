<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>التحقق من صحة الوثيقة | OK to Board</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    margin: 0; padding: 0; background: linear-gradient(135deg, #1a4d8f 0%, #0d1b3e 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #222; padding: 16px;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 28px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25); max-width: 460px; width: 100%;
  }
  .badge {
    display: inline-block; background: #198754; color: #fff;
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
    margin-bottom: 14px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; color: #0d1b3e; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 22px; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #eee; gap: 10px;
  }
  .row:last-child { border-bottom: 0; }
  .label { font-size: 13px; color: #666; }
  .value { font-size: 15px; font-weight: 700; color: #0d1b3e; text-align: left; }
  .footer {
    margin-top: 22px; padding-top: 16px; border-top: 1px dashed #ccc;
    font-size: 12px; color: #888; text-align: center; line-height: 1.6;
  }
  .empty { color: #c62828; font-weight: 700; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">✓ وثيقة معتمدة</div>
    <h1>OK to Board Verification</h1>
    <div class="subtitle">تأكيد صحة السفر — اليامي للسفر والسياحة</div>

    <div id="content"></div>

    <div class="footer">
      ALYAME TRAVEL &amp; TOURISM<br>
      اليامي للسفر والسياحة<br>
      <small>هذه الصفحة تعرض البيانات المُشفّرة في الباركود</small>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const name = params.get('n') || '';
  const passport = params.get('p') || '';
  const vno = params.get('v') || '';
  const content = document.getElementById('content');

  if (!name && !passport) {
    content.innerHTML = '<div class="empty">لا توجد بيانات في الرابط</div>';
  } else {
    let html = '';
    if (name) html += `<div class="row"><span class="label">Passenger Name | اسم المسافر</span><span class="value">${escapeHtml(name)}</span></div>`;
    if (passport) html += `<div class="row"><span class="label">Passport No. | رقم الجواز</span><span class="value">${escapeHtml(passport)}</span></div>`;
    if (vno) html += `<div class="row"><span class="label">Verification No. | رقم التحقق</span><span class="value">${escapeHtml(vno)}</span></div>`;
    content.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
